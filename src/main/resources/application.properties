spring.application.name=vellfire_init

# Google Places API
app.google.places.api-key=${GOOGLE_PLACES_API_KEY}
app.google.places.nearby-search-url=https://places.googleapis.com/v1/places:searchNearby
app.google.places.field-mask=places.id,places.displayName,places.formattedAddress,places.location,places.businessStatus,places.regularOpeningHours,places.currentOpeningHours,places.rating,places.userRatingCount,places.restroom,places.navigationPoints

# Ola Maps Distance Matrix API
app.ola.maps.api-key=${OLA_MAPS_API_KEY}
app.ola.maps.distance-matrix-url=https://api.olamaps.io/routing/v1/distanceMatrix/basic

# Search parameters
app.search.radius-meters=15000
app.search.max-results=6

# Side-analysis tolerance (minimum lateral offset in metres to classify left/right)
app.side-analysis.min-lateral-offset-meters=20.0

# HTTP client timeouts
app.http.connect-timeout-seconds=5
app.http.read-timeout-seconds=10

# Supabase REST API
app.supabase.url=${SUPABASE_URL}
app.supabase.api-key=${SUPABASE_API_KEY}

# Logging
logging.level.com.website.vellfire_init=INFO
logging.level.root=INFO
